# 基础 print 调用模板。完整 MCP/Admin/网页对话尚待内网适配。
# 详见 CODEAGENT_MIGRATION.md。复制到项目根 agent-base.toml 后编辑。
[storage]
root = ".agent-base-codeagent"

[queue]
max_concurrent = 1

[runtime]
engine = "codeagent"
command = ["codeagent"]
# 必须改成当前企业 CLI 和本人账号支持的模型 ID。
model = "replace-with-internal-model"
effort = "high"
timeout_seconds = 1800
# 需要指定认证目录时，在本机配置填写 config_dir，不能提交个人认证文件。
# config_dir 当前相对路径按进程 cwd 解析，建议本机使用明确的目录。
